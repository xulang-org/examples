<div id="out">ready</div>
<script>
window.__XU__=window.__XU__||{};
window.__XU__.listen('tick',function(p){document.getElementById('out').textContent='emit tick '+p;});
window.__XU__.listen('menu',function(p){document.getElementById('out').textContent='menu '+p;});
window.__XU__.listen('tray',function(p){document.getElementById('out').textContent='tray '+p;});
async function goPing(){try{const r=await window.__XU__.invoke('ping','hi');document.getElementById('out').textContent=r;}catch(e){document.getElementById('out').textContent=String(e&&e.message?e.message:e);}}
async function goGreet(){try{const r=await window.__XU__.invoke('greet','Xu');document.getElementById('out').textContent=r;}catch(e){document.getElementById('out').textContent=String(e&&e.message?e.message:e);}}
async function goWin(a){try{const r=await window.__XU__.invoke('win',a);document.getElementById('out').textContent=r;}catch(e){document.getElementById('out').textContent=String(e&&e.message?e.message:e);}}
function playBeep(){
if(window.__XU_MUTED__){document.getElementById('out').textContent='muted — beep blocked';return;}
var AC=window.AudioContext||window.webkitAudioContext;if(!AC){return;}
var ctx=window.__XU_AUDIO_CTX__||new AC();window.__XU_AUDIO_CTX__=ctx;
if(ctx.state==='suspended'){ctx.resume();}
var o=ctx.createOscillator();var g=ctx.createGain();
o.connect(g);g.connect(ctx.destination);
o.frequency.value=880;g.gain.value=0.12;
o.start();o.stop(ctx.currentTime+0.2);
document.getElementById('out').textContent='beep';
}
</script>
