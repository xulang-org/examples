<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xu → WebAssembly 示例</title>
<style>
body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 18px/1.6 system-ui; }
button { padding: .5rem 1rem; font: inherit; cursor: pointer; }
pre { padding: 1rem; background: #f1f4f6; white-space: pre-wrap; }
</style>
<h1>Xu → WebAssembly</h1>
<p>加法、循环和递归由 Xu 编译生成的 WASM 执行。</p>
<button id="run" disabled>运行示例</button>
<pre id="output" aria-live="polite">正在加载 Xu WASM…</pre>
<script type="module">
const output = document.querySelector('#output');
const run = document.querySelector('#run');
try {
  const response = await fetch('../../build/52_wasm.wasm');
  if (!response.ok) throw new Error('请先在仓库根执行 make build EXAMPLE=52_wasm');
  const module = await WebAssembly.compile(await response.arrayBuffer());
  if (WebAssembly.Module.imports(module).length) throw new Error('示例不应依赖宿主导入');
  const exp = new WebAssembly.Instance(module).exports;
  const slots = new DataView(exp.memory.buffer);
  function call(name, ...args) {
    args.forEach((n, i) => slots.setBigInt64(800 - i * 8, BigInt(n), true));
    exp[name + '_frame'](800, 768);
    return slots.getBigInt64(768, true);
  }
  run.addEventListener('click', () => {
    try {
      output.textContent = [
        'add(20, 22) = ' + call('add', 20, 22),
        'fibonacci(10) = ' + call('fibonacci', 10),
        'sum_to(100) = ' + call('sum_to', 100)
      ].join('\n');
    } catch (error) { output.textContent = error.message; }
  });
  output.textContent = 'WASM 已就绪，点击运行。';
  run.disabled = false;
} catch (error) { output.textContent = error.message; }
</script>
</html>
